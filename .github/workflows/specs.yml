name: Specs and Percy

on: [push] # push OR PR

env:
  RAILS_ENV: test
  RUBYOPT: --yjit
  PERCY_TOKEN: ${{ secrets.PERCY_TOKEN }}
  MORPHSVG: ${{ secrets.MORPHSVG }}

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false # let both suites run to completion
      matrix:
        include:
          - name: Normal Specs
            command: bundle exec rspec --exclude-pattern "spec/features/**/*_spec.rb"
            morph: false
          - name: Feature Specs & Percy
            command: npx percy exec -- bundle exec rspec --pattern "spec/features/**/*_spec.rb"
            morph: true
    steps:
    - name: Installing apt dependencies
      run: |
        sudo add-apt-repository ppa:chris-needham/ppa
        sudo apt-get update
        sudo apt-get install libvips libvips-dev audiowaveform rustc # libexpat1-dev gettext libglib2.0-dev liborc-0.4-dev libfftw3-dev liblcms2-dev libmagickwand-dev libopenexr-dev libcfitsio-dev libgif-dev libgsf-1-dev libmatio-dev libopenslide-dev libpango1.0-dev libpoppler-glib-dev librsvg2-dev libwebp-dev
        vips --version

    - uses: actions/checkout@v6

    - name: Get yarn cache directory path
      id: yarn-cache-dir-path
      run: echo "dir=$(yarn cache dir)" >> "$GITHUB_OUTPUT"

    - uses: actions/cache@v5
      id: yarn-cache # use this to check for `cache-hit` (`steps.yarn-cache.outputs.cache-hit != 'true'`)
      with:
        path: |
          ${{ steps.yarn-cache-dir-path.outputs.dir }}
          ./node_modules/
        key: ${{ runner.os }}-yarn6-${{ hashFiles('**/yarn.lock') }}
        restore-keys: |
          ${{ runner.os }}-yarn6-

    - name: Set up Ruby and Bundle Install
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: 4.0.3
        bundler-cache: true

    - name: Yarn install
      run: yarn install
      if: steps.yarn-cache.outputs.cache-hit != 'true'

    - name: JS specs (jest)
      run: yarn jest
      if: ${{ !matrix.morph }}

    - uses: actions/cache@v5
      id: playwright-cache
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ hashFiles('**/yarn.lock') }}
      if: ${{ matrix.morph }}

    - name: Install Playwright chromium
      run: npx playwright install chromium
      if: ${{ matrix.morph && steps.playwright-cache.outputs.cache-hit != 'true' }}

    - name: Put MorphSVGPlugin.js in place for feature specs
      run: |
        printf "%s" "$MORPHSVG" > "app/javascript/animation/MorphSVGPlugin.js"
      if: ${{ matrix.morph }}

    - name: Start db, copy config, setup db
      run: |
        sudo systemctl start mysql.service
        bin/rails setup:copy_config setup:touch_js db:drop db:create db:schema:load

    # Propshaft serves prebuilt assets from app/assets/builds, so the CSS and JS
    # must exist before specs boot. Locally bin/dev runs dartsass:watch and
    # yarn build:watch; CI has no equivalent, so we build once here.
    - name: Build dartsass CSS
      run: bin/rails dartsass:build

    - name: Build esbuild JS
      run: yarn build

    - name: Build admin Tailwind CSS
      run: yarn build:admin-css

    - name: ${{ matrix.name }}
      run: ${{ matrix.command }}

  scan_ruby:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: 4.0.3
        bundler-cache: true
    - name: Brakeman
      run: bin/brakeman --no-pager -i config/brakeman.ignore

  # deploy:
